
{% assign posts = include.posts %}

<ul class="post-list">
  {% for post in posts %}
  <li>
    <time class="date" datetime="{{ post.date | date: "%Y-%m-%d" }}">{{ post.date | date: "%Y-%m-%d" }}</time>
    <a href="{{ post.url }}">{{ post.title }}</a>
    {% include tags.html tags=post.tags %}
  </li>
  {% endfor %}
</ul>
