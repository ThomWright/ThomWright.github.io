<head>
  <link href="https://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  {% seo %}

  <!-- CSS -->
  {% assign cacheBust = site.time | date: '?v=%s' %}

  <!-- Linked here rather than imported from styles.css, so fonts are requested in parallel with it -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;1,400&family=Lato:ital,wght@0,400;0,700;1,400&family=Inconsolata:wght@400;700&display=swap">

  <link rel="stylesheet" href="{{ '/public/css/syntax/highlight.css' | append: cacheBust }}" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="{{ '/public/css/syntax/highlight-dark.css' | append: cacheBust }}" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ '/public/css/styles.css' | append: cacheBust }}">

  <link rel="stylesheet" href="{{ '/public/assets/fontawesome/css/fontawesome.min.css' | append: cacheBust }}">
  <link rel="stylesheet" href="{{ '/public/assets/fontawesome/css/solid.min.css' | append: cacheBust }}">

  <!-- Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/public/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/public/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/public/favicons/favicon-16x16.png">
  <link rel="manifest" href="/public/favicons/site.webmanifest">
  <link rel="mask-icon" href="/public/favicons/safari-pinned-tab.svg" color="#477dca">
  <link rel="shortcut icon" href="/public/favicons/favicon.ico">
  <meta name="msapplication-TileColor" content="#477dca">
  <meta name="msapplication-config" content="/public/favicons/browserconfig.xml">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">

  {% if page.last_modified_at %}
  <meta property="article:modified_time" content="{{ page.last_modified_at | date_to_xmlschema }}">
  {% endif %}
  {% if page.tags %}
  {% for tag in page.tags %}
  <meta property="article:tag" content="{{ tag }}">
  {% endfor %}
  {% endif %}

  {% if page.noindex %}
  <meta name="robots" content="noindex">
  {% endif %}
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">

  <link rel="alternate" type="application/atom+xml" title="Atom feed" href="/atom.xml">

  {% include google_analytics.html %}
</head>
