<svg class="diagram" xmlns="http://www.w3.org/2000/svg" width="352" height="262" viewBox="0 0 352 262" font-family="monospace" font-size="12.5" style="--diagram-width: 352px">
  <defs>
    <marker id="outbox-int-pub-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="d-shape" x="10" y="10" width="170" height="90"/>
  <text x="95" y="36" text-anchor="middle">application</text>
  <rect class="d-shape" x="60" y="52" width="120" height="48"/>
  <text x="120" y="81" text-anchor="middle">publisher</text>

  <!-- Queue -->
  <path class="d-shape" d="M248,58 H334 M334,94 H248 A7,18 0 0 1 248,58"/>
  <ellipse class="d-shape" cx="334" cy="76" rx="7" ry="18"/>
  <text x="284" y="81" text-anchor="middle">queue</text>
  <path class="d-line" d="M180,76 H240" marker-end="url(#outbox-int-pub-arrow)"/>

  <!-- Database -->
  <path class="d-shape" d="M25,180 V244 A45,9 0 0 0 115,244 V180"/>
  <ellipse class="d-shape" cx="70" cy="180" rx="45" ry="9"/>
  <text x="70" y="226" text-anchor="middle">database</text>
  <path class="d-line" d="M45,100 L60,170" marker-end="url(#outbox-int-pub-arrow)"/>
  <path class="d-line" d="M110,100 L84,170" marker-end="url(#outbox-int-pub-arrow)"/>
</svg>
