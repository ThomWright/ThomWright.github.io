<svg class="diagram" xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300" font-family="monospace" font-size="12.5">
  <defs>
    <marker id="pagination-second-page-arrow" class="d-warning" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" color="#d97706">
      <path class="d-arrowhead" d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g class="d-muted" color="#888888">
    <rect class="d-shape d-dotted" x="20" y="124" width="300" height="112" fill="none" stroke="currentColor" stroke-dasharray="0 7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="32" y="144" fill="currentColor">Page 2</text>
  </g>

  <rect class="d-shape" x="104" y="36" width="200" height="36" fill="none" stroke="currentColor"/>
  <text x="204" y="59" text-anchor="middle" fill="currentColor">AA</text>
  <text class="d-bold d-alert" x="292" y="59" text-anchor="end" fill="currentColor" font-weight="bold" color="#ed6145">NEW</text>
  <rect class="d-shape" x="104" y="88" width="200" height="36" fill="none" stroke="currentColor"/>
  <text x="204" y="111" text-anchor="middle" fill="currentColor">A</text>
  <rect class="d-shape" x="104" y="140" width="200" height="36" fill="none" stroke="currentColor"/>
  <text x="204" y="163" text-anchor="middle" fill="currentColor">B</text>
  <rect class="d-shape" x="104" y="192" width="200" height="36" fill="none" stroke="currentColor"/>
  <text x="204" y="215" text-anchor="middle" fill="currentColor">C</text>
  <rect class="d-shape" x="104" y="244" width="200" height="36" fill="none" stroke="currentColor"/>
  <text x="204" y="267" text-anchor="middle" fill="currentColor">D</text>

  <!-- Offset -->
  <g class="d-warning" color="#d97706">
    <path class="d-line" d="M90,36 V120" fill="none" stroke="currentColor" marker-end="url(#pagination-second-page-arrow)"/>
    <text x="80" y="83" text-anchor="end" fill="currentColor">OFFSET 2</text>
  </g>
</svg>
