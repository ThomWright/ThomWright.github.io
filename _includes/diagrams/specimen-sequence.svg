<svg class="diagram" xmlns="http://www.w3.org/2000/svg" width="540" height="570" viewBox="0 0 540 570">
  <defs>
    <marker id="specimen-sequence-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="d-arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Lanes -->
  <text class="d-heading" x="100" y="30" text-anchor="middle">Application</text>
  <text class="d-heading" x="290" y="30" text-anchor="middle">Database</text>
  <text class="d-heading" x="470" y="30" text-anchor="middle">Other system</text>
  <path class="d-line d-thin d-dashed d-muted" d="M100,45 V550 M290,45 V550 M470,45 V550"/>

  <!-- Request -->
  <text x="82" y="85" text-anchor="end">Request</text>
  <rect class="d-shape d-thin d-knockout" x="96.5" y="75" width="7" height="295"/>

  <path class="d-line" d="M103.5,80 L290,120" marker-end="url(#specimen-sequence-arrow)"/>
  <text class="d-halo" x="195" text-anchor="middle"><tspan x="195" y="86">read</tspan><tspan x="195" y="104">checkpoint</tspan><tspan x="195" y="122">ID_x</tspan></text>
  <path class="d-line d-dashed" d="M290,120 L103.5,150" marker-end="url(#specimen-sequence-arrow)"/>
  <text class="d-halo" x="195" y="140" text-anchor="middle">null</text>

  <path class="d-line" d="M103.5,180 L470,215" marker-end="url(#specimen-sequence-arrow)"/>
  <text class="d-halo" x="285" y="203" text-anchor="middle">write</text>
  <path class="d-line d-dashed" d="M470,215 L103.5,250" marker-end="url(#specimen-sequence-arrow)"/>

  <path class="d-line" d="M103.5,280 L290,320" marker-end="url(#specimen-sequence-arrow)"/>
  <text class="d-halo" x="195" text-anchor="middle"><tspan x="195" y="286">write</tspan><tspan x="195" y="304">checkpoint</tspan><tspan x="195" y="322">ID_x = 1</tspan></text>
  <path class="d-line d-dashed" d="M290,320 L103.5,350" marker-end="url(#specimen-sequence-arrow)"/>

  <g class="d-alert">
    <path class="d-line d-cross" d="M93,363 l14,14 M107,363 l-14,14"/>
    <text class="d-halo" x="116" y="375">crash or client timeout</text>
  </g>

  <path class="d-line d-dotted d-muted" d="M20,410 H530"/>

  <!-- Retry -->
  <text x="82" y="455" text-anchor="end">Retry</text>
  <rect class="d-shape d-thin d-knockout" x="96.5" y="445" width="7" height="80"/>

  <path class="d-line" d="M103.5,450 L290,490" marker-end="url(#specimen-sequence-arrow)"/>
  <text class="d-halo" x="195" text-anchor="middle"><tspan x="195" y="456">read</tspan><tspan x="195" y="474">checkpoint</tspan><tspan x="195" y="492">ID_x</tspan></text>
  <path class="d-line d-dashed" d="M290,490 L103.5,520" marker-end="url(#specimen-sequence-arrow)"/>
  <text class="d-halo" x="195" y="510" text-anchor="middle">1</text>
</svg>
