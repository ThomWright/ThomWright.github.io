<svg class="diagram" xmlns="http://www.w3.org/2000/svg" width="603" height="530" viewBox="0 0 603 530" font-family="monospace" font-size="12.5">
  <defs>
    <marker id="pg-locks-example-arrow" class="d-muted" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" color="#888888">
      <path class="d-arrowhead" d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="d-heading" x="20" y="30" fill="currentColor" font-size="14.17" font-weight="bold">Connection 1</text>
  <text class="d-muted" x="20" y="52" fill="currentColor" color="#888888">Reader</text>
  <text class="d-heading" x="220" y="30" fill="currentColor" font-size="14.17" font-weight="bold">Connection 2</text>
  <text class="d-muted" x="220" y="52" fill="currentColor" color="#888888">Migrator</text>
  <text class="d-heading" x="420" y="30" fill="currentColor" font-size="14.17" font-weight="bold">Connection 3/4/5/…</text>
  <text class="d-muted" x="420" y="52" fill="currentColor" color="#888888">Application</text>

  <path class="d-line d-thin d-dashed d-muted" d="M20,320 H420" fill="none" stroke="currentColor" stroke-dasharray="7 6" color="#888888"/>
  <path class="d-line d-thin d-dashed d-muted" d="M220,420 H420" fill="none" stroke="currentColor" stroke-dasharray="7 6" color="#888888"/>

  <!-- Connection 1 -->
  <path class="d-line d-thick d-success" d="M20,110 V320" fill="none" stroke="currentColor" stroke-width="4" color="#5e9e3a"/>
  <text x="40" y="95" fill="currentColor">BEGIN</text>
  <text x="40" y="135" fill="currentColor">SELECT *</text>
  <text x="62.5" y="155" fill="currentColor">WHERE id = 1</text>
  <text class="d-muted" x="40" y="215" fill="currentColor" color="#888888">sits around...</text>
  <text x="40" y="315" fill="currentColor">COMMIT</text>

  <!-- Connection 2 -->
  <path class="d-line d-thick d-alert" d="M220,130 V320" fill="none" stroke="currentColor" stroke-width="4" color="#ed6145"/>
  <path class="d-line d-thick d-warning" d="M220,320 V420" fill="none" stroke="currentColor" stroke-width="4" color="#d97706"/>
  <text x="240" y="115" fill="currentColor">BEGIN</text>
  <text class="d-muted" x="240" y="155" fill="currentColor" color="#888888">ALTER TABLE</text>
  <text class="d-muted" x="262.5" y="175" fill="currentColor" color="#888888">ADD COLUMN</text>
  <text class="d-muted" x="240" y="215" fill="currentColor" color="#888888">waits...</text>
  <text x="240" y="345" fill="currentColor">ALTER TABLE</text>
  <text x="262.5" y="365" fill="currentColor">ADD COLUMN</text>
  <text x="240" y="415" fill="currentColor">COMMIT</text>

  <!-- Connection 3/4/5/… -->
  <path class="d-line d-thick d-alert" d="M420,210 V420" fill="none" stroke="currentColor" stroke-width="4" color="#ed6145"/>
  <path class="d-line d-thick d-success" d="M420,420 V510" fill="none" stroke="currentColor" stroke-width="4" color="#5e9e3a"/>
  <text x="440" y="195" fill="currentColor">BEGIN</text>
  <text class="d-muted" x="440" y="235" fill="currentColor" color="#888888">SELECT *</text>
  <text class="d-muted" x="462.5" y="255" fill="currentColor" color="#888888">WHERE id = 1</text>
  <text class="d-muted" x="440" y="295" fill="currentColor" color="#888888">waits...</text>
  <text x="440" y="445" fill="currentColor">SELECT *</text>
  <text x="462.5" y="465" fill="currentColor">WHERE id = 1</text>
  <text x="440" y="505" fill="currentColor">COMMIT</text>

  <text class="d-muted" x="440" y="95" fill="currentColor" color="#888888">Can't acquire lock,</text>
  <text class="d-muted" x="440" y="115" fill="currentColor" color="#888888">waits in lock queue</text>
  <path class="d-line d-thin d-muted" d="M432.5,100 L330,150" fill="none" stroke="currentColor" marker-end="url(#pg-locks-example-arrow)" color="#888888"/>
  <path class="d-line d-thin d-muted" d="M492.5,122 L492.5,218" fill="none" stroke="currentColor" marker-end="url(#pg-locks-example-arrow)" color="#888888"/>
</svg>
