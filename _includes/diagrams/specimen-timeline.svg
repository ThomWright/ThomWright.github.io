<svg class="diagram" xmlns="http://www.w3.org/2000/svg" width="620" height="510" viewBox="0 0 620 510">
  <!-- Headers -->
  <text class="d-heading" x="20" y="30">Connection 1</text>
  <text class="d-muted" x="20" y="52">Reader</text>
  <text class="d-heading" x="220" y="30">Connection 2</text>
  <text class="d-muted" x="220" y="52">Migrator</text>
  <text class="d-heading" x="420" y="30">Connection 3/4/5/…</text>
  <text class="d-muted" x="420" y="52">Application</text>

  <!-- Points where one connection unblocks another -->
  <path class="d-line d-dashed d-muted d-thin" d="M20,320 H420 M220,420 H620"/>

  <!-- Connection 1 -->
  <g class="d-muted">
    <path class="d-line d-thick" d="M20,118 V320"/>
    <text x="40" y="98">BEGIN</text>
    <text x="40" y="138">SELECT *</text>
    <text x="64" y="158">WHERE id = 1</text>
    <text x="40" y="193">sits around...</text>
    <text x="40" y="314">COMMIT</text>
  </g>

  <!-- Connection 2 -->
  <g class="d-muted">
    <path class="d-line d-thick" d="M220,138 V420"/>
    <text x="240" y="118">BEGIN</text>
    <text x="240" y="158">ALTER TABLE</text>
    <text x="264" y="178">ADD COLUMN</text>
    <text x="240" y="213">waits...</text>
    <text x="240" y="338">ALTER TABLE</text>
    <text x="264" y="358">ADD COLUMN</text>
    <text x="240" y="414">COMMIT</text>
  </g>

  <!-- Connection 3 -->
  <text class="d-accent" x="440" y="198">BEGIN</text>
  <path class="d-line d-thick" d="M420,220 V420 M404,220 H436 M404,420 H436"/>
  <g class="d-muted">
    <text x="440" y="238">SELECT *</text>
    <text x="464" y="258">WHERE id = 1</text>
    <text x="440" y="293">waits...</text>
  </g>
  <text class="d-bold d-halo" x="432" y="355">lock_timeout</text>
  <path class="d-line d-thick d-success" d="M420,422 V500"/>
  <g class="d-accent">
    <text x="440" y="440">SELECT *</text>
    <text x="464" y="460">WHERE id = 1</text>
    <text x="440" y="495">COMMIT</text>
  </g>
</svg>
